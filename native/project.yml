name: PDBridgeNative
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PDBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ios/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pdbridge.private.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PDBridge
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PDBridge
  PDBridge:
    type: application
    platform: iOS
    sources:
      - ios/Observation.swift
      - ios/ObservationAnalytics.swift
      - ios/ObservationService.swift
      - ios/ProtectedObservationVault.swift
      - ios/ObservationBackup.swift
      - ios/NativeStrings.swift
      - shared/FictionalWatchEvent.swift
      - ios/App
    resources:
      - ios/App/Assets.xcassets
      - ios/App/PrivacyInfo.xcprivacy
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIFileSharingEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pdbridge.private
        TARGETED_DEVICE_FAMILY: "1"
        PRIVACY_POLICY_URL: "https://tanupunjani.github.io/pd-bridge-case-study/privacy.html"
      configs:
        Debug:
          APP_DISPLAY_NAME: "PD Bridge Fictional"
          MARKETING_VERSION: "0.1.0"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PD_BRIDGE_SYNTHETIC_BUILD"
        Release:
          APP_DISPLAY_NAME: "PD Bridge"
          MARKETING_VERSION: "1.0.0"
          CURRENT_PROJECT_VERSION: "1"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: ""
  PDBridgeWatch:
    type: application
    platform: watchOS
    sources:
      - watch
      - shared/FictionalWatchEvent.swift
    resources:
      - watch/Assets.xcassets
    info:
      path: watch/Info.plist
      properties:
        CFBundleDisplayName: PD Bridge Test
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: false
        WKCompanionAppBundleIdentifier: org.pdbridge.private
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pdbridge.private.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  PDBridge:
    build:
      targets:
        PDBridge: all
    run:
      config: Debug
  PDBridgeWatch:
    build:
      targets:
        PDBridgeWatch: all
    run:
      config: Debug
